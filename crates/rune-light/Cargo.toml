[package]
name = "rune-light"
version = "0.0.1"
edition.workspace = true
license.workspace = true
description = "Real-time lighting for Rune UIs: SDF soft shadows, bevel normals, god rays and radiance-cascade GI over the frame's analytic primitives."

[dependencies]
wgpu = { version = "30", default-features = false, features = ["std", "parking_lot", "metal", "wgsl"] }
bytemuck = { version = "1.25", features = ["derive"] }

[target.'cfg(not(target_os = "macos"))'.dependencies]
wgpu = { version = "30", default-features = false, features = ["vulkan", "dx12"] }

[dev-dependencies]
rune = { path = "../rune" }
pollster = "1"
png = "0.18"
