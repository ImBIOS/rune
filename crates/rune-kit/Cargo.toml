[package]
name = "rune-kit"
version = "0.0.1"
edition.workspace = true
license.workspace = true
description = "Generic, themable components for Rune. Components read only semantic tokens (`Kit`); a theme crate supplies them."

[dependencies]
rune = { path = "../rune" }
rune-motion = { path = "../rune-motion" }
unicode-segmentation = "1.13"
pulldown-cmark = { version = "0.13", default-features = false, optional = true }

[features]
# `Markdown` and `MarkdownStyle`.
markdown = ["dep:pulldown-cmark"]
# Native ```mermaid diagrams in `Markdown` (flowcharts and sequence diagrams), and `mermaid`.
mermaid = ["markdown"]

[[example]]
name = "scroll_x"
required-features = ["markdown"]

[dev-dependencies]
# Reference rasteriser for the built-in glyphs (tests/glyphs.rs).
resvg = { version = "0.45", default-features = false }
