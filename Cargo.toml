[workspace]
resolver = "3"
members = [
    "crates/rune",
    "crates/rune-ref",
    "crates/rune-motion",
    "crates/rune-kit",
    "crates/rune-fx",
    "crates/rune-light",
    "themes/opencode",
    "examples/settings",
    "examples/opencode",
    "examples/kit-gallery",
    "examples/background",
    "examples/live-values",
    "examples/shapes",
    "examples/overlay",
]

[workspace.package]
edition = "2024"
license = "MIT"

[profile.release]
codegen-units = 16
