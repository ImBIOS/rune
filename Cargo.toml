[workspace]
resolver = "3"
members = [
    "crates/rune",
    "crates/rune-ref",
    "crates/rune-motion",
    "crates/rune-kit",
    "crates/rune-fx",
    "crates/rune-light",
    "themes/opencode",
    "examples/hello",
    "examples/todo",
    "examples/settings",
    "examples/opencode",
    "examples/kit-gallery",
    "examples/background",
    "examples/live-values",
    "examples/shapes",
    "examples/overlay",
    "examples/overlay-lab",
    "examples/lab",
    "examples/video-tiles",
    "examples/dev-panel",
]
exclude = ["tools/rune-dev-guard"]

[workspace.package]
edition = "2024"
license = "MIT"

[profile.dev.package."*"]
debug = false

[profile.release]
codegen-units = 16

[profile.rune-hot]
inherits = "dev"
debug = 0
incremental = true

[profile.rune-hot.package.png]
opt-level = 3

[profile.rune-hot.package.fdeflate]
opt-level = 3
