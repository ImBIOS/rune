[package]
name = "opencode"
version = "0.0.1"
edition.workspace = true
license.workspace = true

[features]
frame-profile = ["rune/frame-profile", "dep:procwatch"]
hot = ["rune/hot"]

[dependencies]
procwatch = { path = "../../crates/procwatch", optional = true }
rune = { path = "../../crates/rune" }
serde_json = "1"
ureq = { version = "3.4", default-features = false }
rune-kit = { path = "../../crates/rune-kit", features = ["markdown", "mermaid"] }
rune-theme-opencode = { path = "../../themes/opencode" }
